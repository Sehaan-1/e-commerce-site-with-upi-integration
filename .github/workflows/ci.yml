name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint + Type-check ───────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run typecheck

  # ── Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          # Unit tests mock the DB — these are placeholder values
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          ADMIN_PASSWORD: test-admin-password
          ADMIN_SESSION_SECRET: test-session-secret-32-chars-long!!
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STORE_NAME: Kalpa Living Test

  # ── Production Build ────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Build-time env vars needed by Next.js
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
          ADMIN_PASSWORD: ci-build-placeholder
          ADMIN_SESSION_SECRET: ci-build-session-secret-placeholder!!
          NEXT_PUBLIC_BASE_URL: https://kalpaliving.com
          NEXT_PUBLIC_STORE_NAME: Kalpa Living

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7

  # ── E2E Tests (Playwright) ──────────────────────────────────────────────
  # Runs on a schedule (nightly) and on pushes to main to avoid slow CI for PRs.
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    # Run E2E on main pushes and on a schedule; skip for PRs to keep CI fast
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Push database schema
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_db

      - name: Build for E2E
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_db
          ADMIN_PASSWORD: e2e-admin-password
          ADMIN_SESSION_SECRET: e2e-session-secret-32-chars-long!!
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STORE_NAME: Kalpa Living E2E

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_db
          ADMIN_PASSWORD: e2e-admin-password
          ADMIN_SESSION_SECRET: e2e-session-secret-32-chars-long!!
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STORE_NAME: Kalpa Living E2E
          PAYMENT_MODE: sandbox

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
