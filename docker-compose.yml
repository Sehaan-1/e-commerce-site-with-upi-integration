name: kalpa-living

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kalpa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js App ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env                          # copy .env.example → .env and fill in values
    environment:
      # Override DB URL to point to the Docker service name
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    ports:
      - "3000:3000"
    networks:
      - kalpa-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ── Internal network ──────────────────────────────────────────────────────
networks:
  kalpa-net:
    driver: bridge
